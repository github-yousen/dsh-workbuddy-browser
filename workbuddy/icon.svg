<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img">
  <defs>
    <linearGradient id="wbIconAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="wbIconWin">
      <rect x="4" y="7" width="28" height="22" rx="4.5"/>
    </clipPath>
    <mask id="wbIconCursorHole">
      <rect x="0" y="0" width="36" height="36" fill="#ffffff"/>
      <path d="M20 19.5l0 12 3.1-3.4 2.2 4.6 2.3-1.1-2.2-4.6 4.6-.5z" fill="#000000"/>
    </mask>
  </defs>

  <!-- window body -->
  <rect x="4" y="7" width="28" height="22" rx="4.5" fill="url(#wbIconAccent)"/>
  <g clip-path="url(#wbIconWin)">
    <!-- title bar -->
    <rect x="4" y="7" width="28" height="6.6" fill="#0f766e"/>
    <!-- page -->
    <rect x="7.4" y="16.6" width="13.6" height="2.2" rx="1.1" fill="#ffffff" opacity="0.95"/>
    <rect x="7.4" y="21" width="18.4" height="2" rx="1" fill="#ffffff" opacity="0.62"/>
    <rect x="7.4" y="24.9" width="10.2" height="2" rx="1" fill="#ffffff" opacity="0.42"/>
  </g>
  <rect x="4" y="7" width="28" height="22" rx="4.5" fill="none" stroke="#0f766e" stroke-width="1.5"/>

  <!-- cursor, knocked out of the window so it reads on any background -->
  <g mask="url(#wbIconCursorHole)">
    <path d="M20 19.5l0 12 3.1-3.4 2.2 4.6 2.3-1.1-2.2-4.6 4.6-.5z" fill="#1e293b"/>
  </g>
  <path d="M20 19.5l0 12 3.1-3.4 2.2 4.6 2.3-1.1-2.2-4.6 4.6-.5z" fill="#1e293b" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
