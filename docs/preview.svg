<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img">
  <defs>
    <linearGradient id="wbbAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="wbbAgent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="wbbWinClip">
      <rect x="96" y="60" width="448" height="184" rx="12"/>
    </clipPath>
  </defs>

  <!-- agent node -->
  <circle cx="64" cy="150" r="26" fill="url(#wbbAgent)"/>
  <circle cx="64" cy="144" r="7" fill="#ffffff" opacity="0.95"/>
  <path d="M50 166c4-9 24-9 28 0z" fill="#ffffff" opacity="0.95"/>

  <!-- connector: agent -> browser (drawn after the window so it is not clipped) -->
  <path d="M92 150h40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M126 143l10 7-10 7z" fill="#94a3b8"/>

  <!-- browser window -->
  <rect x="96" y="60" width="448" height="184" rx="12" fill="#e2e8f0"/>
  <g clip-path="url(#wbbWinClip)">
    <rect x="96" y="60" width="448" height="36" fill="#cbd5e1"/>
    <!-- tab strip -->
    <rect x="112" y="70" width="86" height="18" rx="6" fill="url(#wbbAccent)"/>
    <rect x="206" y="70" width="70" height="18" rx="6" fill="#94a3b8" opacity="0.55"/>
    <rect x="284" y="70" width="70" height="18" rx="6" fill="#94a3b8" opacity="0.35"/>

    <!-- page content -->
    <rect x="96" y="96" width="448" height="148" fill="#f8fafc"/>

    <!-- highlighted/claimed tab marker -->
    <circle cx="182" cy="79" r="4" fill="#0f766e"/>

    <!-- a content skeleton the agent reads -->
    <rect x="120" y="118" width="196" height="12" rx="6" fill="#94a3b8" opacity="0.7"/>
    <rect x="120" y="142" width="300" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="120" y="158" width="272" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="120" y="174" width="316" height="8" rx="4" fill="#cbd5e1"/>

    <!-- a button the agent clicks -->
    <rect x="120" y="200" width="96" height="26" rx="13" fill="url(#wbbAccent)"/>
    <rect x="132" y="210" width="72" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

    <!-- cursor -->
    <path d="M206 196l0 26 7-8 5 11 5-2-5-11 10-1z" fill="#1e293b"/>
  </g>
  <rect x="96" y="60" width="448" height="184" rx="12" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- result flowing back: head points right, away from the browser -->
  <path d="M564 150h-30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M530 143l10 7-10 7z" fill="#94a3b8"/>
  <rect x="566" y="122" width="52" height="56" rx="10" fill="#0f766e" opacity="0.12"/>
  <rect x="578" y="136" width="28" height="5" rx="2.5" fill="#0f766e"/>
  <rect x="578" y="148" width="28" height="5" rx="2.5" fill="#0f766e" opacity="0.7"/>
  <rect x="578" y="160" width="18" height="5" rx="2.5" fill="#0f766e" opacity="0.45"/>
</svg>
